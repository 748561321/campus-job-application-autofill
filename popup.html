<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="styles.css"><title>Campus Application Autofill</title></head>
<body class="popup"><header><div><h1 data-i18n="title">校招网申助手</h1><span class="safe" data-i18n="safe">本地处理 · 不自动提交</span></div><select id="uiLanguage" aria-label="Language"><option value="zh-CN">中文</option><option value="en">English</option></select></header>
<section id="status" class="notice" data-i18n="intro">请打开招聘表单，然后点击“扫描当前页面”。插件不会在后台读取网页。</section>
<label class="mode-row"><span data-i18n="educationStage">当前教育阶段</span><select id="educationLevel"><option value="auto" data-i18n="auto">自动识别</option><option value="master" data-i18n="master">硕士</option><option value="bachelor" data-i18n="bachelor">本科</option><option value="highSchool" data-i18n="highSchool">高中</option></select></label>
<label class="mode-row"><span data-i18n="existingProtection">已有内容保护</span><span><input id="overwriteExisting" type="checkbox"> <span data-i18n="overwrite">覆盖已有内容</span></span></label>
<div class="actions"><button id="scan" class="secondary" data-i18n="scan">扫描当前页面</button><button id="fill" class="primary" disabled data-i18n="fill">填充高置信字段</button></div>
<details class="repeat-panel"><summary data-i18n="repeatCount">重复经历数量</summary><div class="repeat-grid"><label><span data-i18n="education">教育</span> <input id="educationCount" type="number" min="0" max="3" value="2"></label><label><span data-i18n="project">项目</span> <input id="projectCount" type="number" min="0" max="8" value="3"></label><label><span data-i18n="award">获奖</span> <input id="awardCount" type="number" min="0" max="8" value="3"></label></div><button id="prepareGroups" class="secondary full" disabled data-i18n="prepare">补齐经历卡片</button><small data-i18n="prepareHint">只点击对应的“添加”，不会删除内容或提交申请。</small></details>
<section><div class="summary"><strong id="matched">0</strong> <span data-i18n="fillable">个可填写</span>，<strong id="existing">0</strong> <span data-i18n="existing">个已有内容</span>，<strong id="manual">0</strong> <span data-i18n="manual">个需确认</span>，<strong id="noValue">0</strong> <span data-i18n="missing">个资料缺失</span>，<strong id="unknown">0</strong> <span data-i18n="unknown">个未识别</span></div><div id="fields" class="fields"><div class="empty" data-i18n="notScanned">尚未扫描。</div></div></section>
<details><summary data-i18n="showManual">查看需人工确认和资料缺失字段</summary><div id="manualFields" class="fields unknownFields"></div></details><details><summary data-i18n="showUnknown">查看未识别字段</summary><div id="unknownFields" class="fields unknownFields"></div></details>
<button id="diagnostics" class="secondary full" disabled data-i18n="diagnostics">导出脱敏诊断JSON</button><footer><button id="options" class="link" data-i18n="manage">管理本地资料</button></footer><script src="popup.js"></script></body></html>
