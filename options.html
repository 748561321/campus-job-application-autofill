<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="styles.css"><title>Local Profile Manager</title></head>
<body class="options"><main><div class="page-head"><div><h1 data-i18n="本地资料管理">本地资料管理</h1><p class="muted" data-i18n="资料说明">资料仅保存在当前浏览器。请勿在公共电脑使用，导出的备份包含隐私。</p></div><div><select id="uiLanguage" aria-label="Language"><option value="zh-CN">中文</option><option value="en">English</option></select> <span class="safe" data-i18n="不上传云端">不上传云端</span></div></div>
<div class="toolbar"><button id="newProfile" class="secondary" data-i18n="新建空白资料">新建空白资料</button><button id="loadExample" class="secondary" data-i18n="恢复示例资料">恢复示例资料</button><label class="fileBtn"><span data-i18n="导入本地JSON">导入本地JSON</span><input id="importFile" type="file" accept="application/json"></label><button id="export" class="secondary" data-i18n="导出备份">导出备份</button><button id="save" class="primary" data-i18n="保存到本机">保存到本机</button></div>
<nav id="sectionNav" class="section-nav"></nav><form id="profileForm" autocomplete="off"></form><div id="message" class="notice" data-i18n="填写提示">请直接填写格子；留空字段不会自动填写到网页。</div></main><script src="options.js"></script></body></html>
