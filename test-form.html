<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>网申助手测试页</title>
<style>body{font-family:Microsoft YaHei;max-width:760px;margin:30px auto}label{display:block;margin:14px 0 5px}input,textarea,select{width:100%;padding:8px}textarea{height:90px}</style></head>
<body>
  <h1>模拟校园招聘申请表</h1>
  <label for="name">姓名</label><input id="name" name="candidateName">
  <label for="phone">手机号码</label><input id="phone" name="mobile">
  <label for="email">电子邮箱</label><input id="email" type="email">
  <label for="political">政治面貌</label><select id="political"><option>请选择</option><option>中共党员</option><option>共青团员</option><option>群众</option></select>
  <label for="major">硕士专业</label><input id="major">
  <label for="gpa">GPA</label><input id="gpa">
  <label for="company">实习公司</label><input id="company">
  <label for="description">工作内容</label><textarea id="description"></textarea>
  <label for="self">自我评价</label><textarea id="self"></textarea>
  <button type="button">模拟提交（不会执行）</button>
</body></html>
